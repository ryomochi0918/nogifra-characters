<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乃木フラ - スキルフローチャート図鑑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <div class="eyebrow">Skill Flowchart Archive</div>
      <h1>乃木フラスキル<br />フローチャート</h1>
      <p>
        キャラクターを選ぶと、スキル説明を整合性チェック済みのフローチャートで確認できます。
      </p>
    </header>

    <div class="toolbar">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="キャラ名・衣装名・スキル内容で検索(正規表現対応)"
          autocomplete="off"
        />
      </div>

      <div class="filter-bar">
        <select id="memberFilter" class="filter-select">
          <option value="">キャラ: すべて</option>
        </select>
        <select id="genFilter" class="filter-select">
          <option value="">期: すべて</option>
        </select>
        <div class="attr-filter" id="attrFilter">
          <button type="button" class="tab-btn attr-btn" data-attr="努力">
            努力
          </button>
          <button type="button" class="tab-btn attr-btn" data-attr="感謝">
            感謝
          </button>
          <button type="button" class="tab-btn attr-btn" data-attr="笑顔">
            笑顔
          </button>
        </div>
      </div>
    </div>

    <main class="stage" id="stage">
      <!-- カードはJSでcharacters.jsonから生成 -->
    </main>

    <div class="viewer" id="viewer">
      <div class="viewer-panel">
        <button
          type="button"
          class="viewer-close"
          id="viewerClose"
          aria-label="閉じる"
        >
          ✕
        </button>
        <h2 id="viewerTitle"></h2>
        <p class="subtitle" id="viewerSubtitle"></p>
        <div class="tabs" id="viewerTabs"></div>
        <div class="zoom-bar" id="zoomBar">
          <button type="button" class="zoom-btn" id="zoomOut" aria-label="縮小">
            −
          </button>
          <span class="zoom-label" id="zoomLabel">100%</span>
          <button type="button" class="zoom-btn" id="zoomIn" aria-label="拡大">
            ＋
          </button>
          <button
            type="button"
            class="zoom-btn"
            id="zoomReset"
            aria-label="リセット"
            style="width: auto; padding: 0 10px; font-size: 12px"
          >
            リセット
          </button>
        </div>
        <div class="diagram-wrap" id="diagramWrap">
          <div id="diagramTarget" class="loading">読み込み中...</div>
        </div>
        <details class="original-text" id="originalText" style="display: none">
          <summary>原文を見る</summary>
          <div class="original-text-body" id="originalTextBody"></div>
        </details>
      </div>
    </div>

    <footer>
      個人制作・非公式のファン向けアーカイブです。<br />
      各フローチャートはAIによる画像読み取り・生成のため、誤りが含まれる可能性があります。気になる場合は原文と併せてご確認ください。
    </footer>

    <button
      type="button"
      class="theme-toggle"
      id="themeToggle"
      aria-label="ライトモード切り替え"
    >
      <span class="track">
        <span class="icon icon-sun">☀️</span>
        <span class="icon icon-moon">🌙</span>
        <span class="thumb"></span>
      </span>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
